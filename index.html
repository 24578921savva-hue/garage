<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Гараж</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f4f4f4; --card:#ffffff; --text:#1a1a1a; --muted:#6b6b6b;
  --accent:#2e7d32; --accent2:#1b5e20; --line:#e0e0e0; --danger:#c62828;
}
html[data-theme="dark"]{ --bg:#121212; --card:#1e1e1e; --text:#eaeaea; --muted:#9a9a9a; --accent:#66bb6a; --accent2:#43a047; --line:#333; --danger:#ef5350; }
html[data-theme="neon-red"]{ --bg:#0a0000; --card:#1a0505; --text:#ff3333; --muted:#993333; --accent:#ff0000; --accent2:#cc0000; --line:#4d0000; --danger:#ff5555; }
html[data-theme="acid-pink"]{ --bg:#120014; --card:#1f0024; --text:#ff00ff; --muted:#a000a0; --accent:#ff0080; --accent2:#c70068; --line:#4d0059; --danger:#ff0066; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:90px; background-size:cover; background-position:center; background-attachment:fixed; }
body.has-bg::before{content:""; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:-1;}
header{ position:sticky; top:0; z-index:20; background:var(--card); padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding-top:calc(12px + env(safe-area-inset-top)); }
header h1{font-size:18px; margin:0; flex:1; font-weight:600}
.btn{border:none; background:var(--accent); color:#fff; border-radius:10px; padding:10px 14px; font-size:15px; cursor:pointer; font-weight:500;}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn:active{opacity:.75}
.icon-btn{border:none; background:transparent; font-size:22px; cursor:pointer; color:var(--text); padding:6px 8px; border-radius:8px;}
main{padding:12px 16px; max-width:720px; margin:0 auto}
.card{background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:10px; border:1px solid var(--line); cursor:pointer; display:flex; align-items:center; gap:12px; transition:transform .05s;}
.card:active{transform:scale(.985)}
.card .main{flex:1; min-width:0}
.card .title{font-size:16px; font-weight:500; word-break:break-word}
.card .sub{font-size:13px; color:var(--muted); margin-top:2px}
.card .arrow{color:var(--muted); font-size:20px}
.search{width:100%; padding:14px 16px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); margin-bottom:12px;}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:18px 0 8px; font-weight:600}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:15px}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.fab{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); width:58px; height:58px; border-radius:50%; background:var(--accent); color:#fff; font-size:30px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:30; display:flex; align-items:center; justify-content:center;}
.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; margin:10px 0}
.photo-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; cursor:pointer; background:#000}
.photo-actions{display:flex; gap:8px; margin-top:8px}
.list-item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
.list-item .main{flex:1; word-break:break-word}
.list-item .del{color:var(--danger); background:none; border:none; font-size:20px; cursor:pointer}
textarea,input[type=text],input[type=number],select{ width:100%; padding:12px 14px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-family:inherit; margin-bottom:10px;}
label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px; font-weight:500}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:var(--card); width:100%; max-width:720px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto;}
.modal h2{margin:0 0 14px; font-size:18px}
.viewer{position:fixed; inset:0; background:#000; z-index:200; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.viewer img{max-width:100%; max-height:100%; object-fit:contain; transition:transform .1s}
.viewer .close{position:absolute; top:calc(12px + env(safe-area-inset-top)); right:16px; color:#fff; font-size:32px; background:none; border:none; cursor:pointer; z-index:5}
.viewer .nav{position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:40px; background:rgba(0,0,0,.4); border:none; border-radius:50%; width:52px; height:52px; cursor:pointer; z-index:5}
.viewer .nav.prev{left:10px} .viewer .nav.next{right:10px}
.viewer .bottom{position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:0; right:0; display:flex; gap:10px; justify-content:center; z-index:5; padding:0 20px}
.info-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--muted)}
.toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.chip{padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card); font-size:14px; cursor:pointer; color:var(--text); transition: all 0.2s;}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight: 600;}
.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; z-index:300; opacity:0; transition:opacity .25s; pointer-events:none;}
.toast.show{opacity:1}
.hidden{display:none!important}
.qr-box{text-align:center; padding:16px; background:#fff; border-radius:12px; margin:10px 0}
.qr-box img{max-width:220px; width:100%}
.settings-item{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line);}
.settings-item:last-child{border-bottom:none}
.fav-star{font-size:20px; color:var(--accent); background:none; border:none; cursor:pointer}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .2s;}
.overlay.show{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; left:0; bottom:0; width:280px; background:var(--card); z-index:95; transform:translateX(-100%); transition:transform .25s; padding-top:calc(20px + env(safe-area-inset-top)); overflow-y:auto; border-right:1px solid var(--line);}
.drawer.show{transform:translateX(0)}
.drawer h2{margin:0 16px 16px; font-size:18px}
.drawer-item{display:flex; align-items:center; gap:12px; padding:14px 20px; cursor:pointer; font-size:16px; border:none; background:none; color:var(--text); width:100%; text-align:left;}
.drawer-item:active{background:var(--bg)}
.drawer-item .ico{font-size:20px; width:24px}
.drawer-divider{height:1px; background:var(--line); margin:10px 16px}
.gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:8px}
.gallery-grid .item{position:relative; aspect-ratio:1; background:#000; cursor:pointer; overflow:hidden}
.gallery-grid .item img{width:100%; height:100%; object-fit:cover}
.gallery-grid .item .lab{position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.75)); color:#fff; font-size:11px; padding:14px 4px 4px; text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="drawerOverlay" class="overlay" onclick="closeDrawer()"></div>
<script src="app.js"></script>
</body>
</html>
